#app{max-width:920px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:28px;font-weight:800;margin:0;line-height:1.1}
h2{font-size:18px;font-weight:700;margin:20px 0 10px}
.card h2{margin-top:0}
.sub{color:var(--muted);font-size:14px;margin:0}
.warn{color:var(--danger);font-weight:600;font-size:14px;margin:0}
.ok{color:var(--accent-text);font-weight:600;font-size:14px;margin:0}
.neg{color:var(--danger);font-weight:600}
.bar{display:flex;align-items:center;gap:14px;margin-bottom:8px;flex-wrap:wrap}
.card{background:rgba(240,249,250,.9);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:18px}
.col{display:flex;flex-direction:column;gap:10px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary,.ghost{border-radius:10px;padding:11px 16px;font-weight:600;border:1px solid var(--line);background:transparent}
.primary{background:var(--accent);color:var(--on);border-color:var(--accent);font-weight:700}
.ghost{color:var(--accent-text);border-color:var(--accent)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.sellers{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.seller{min-height:96px;border:2px solid var(--accent);border-radius:14px;background:rgba(240,249,250,.9);font-size:24px;font-weight:800;padding:16px;text-align:left;transition:background .15s}
.seller:hover{background:var(--accent);color:var(--on)}
.pend{display:block;font-size:14px;font-weight:600;margin-top:6px;color:var(--accent-text)}
.seller:hover .pend{color:inherit}
.cols{display:grid;gap:20px;grid-template-columns:1fr}
@media (min-width:760px){.cols{grid-template-columns:1fr 340px;align-items:start}.cols .card{margin-top:20px}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fish{min-height:84px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;transition:border-color .15s}
.fish:hover{border-color:var(--accent)}
.fn{font-size:18px;font-weight:700}
.fp{color:var(--accent-text);font-weight:600}
.fs{font-size:13px;color:var(--muted)}
.list{list-style:none;margin:0;padding:0}
.list li{display:grid;grid-template-columns:1fr auto 32px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.list li div strong,.list li div span{display:block}
.total{background:var(--accent);color:var(--on);border-radius:12px 12px 12px 3px;padding:14px 16px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.total strong{font-size:34px;font-weight:800;line-height:1}
.rec{display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
input,select{font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-width:0;width:100%}
.row{display:grid;grid-template-columns:1fr 104px 36px;gap:8px;align-items:center;margin-bottom:8px}
.row.v{grid-template-columns:1fr 36px}
.row.head{font-size:13px;color:var(--muted);margin-bottom:4px}
.x{border:0;background:transparent;color:var(--muted);font-size:22px;border-radius:8px;line-height:1;padding:4px}
.x:hover{color:var(--danger)}
.frow{margin-bottom:14px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.frow select[data-k="c"]{grid-column:1/2}
.frow select[data-k="u"]{grid-column:2/4}
dialog{border:1px solid var(--line);border-radius:16px;background:#fff;color:var(--ink);padding:20px;width:min(92vw,380px)}
dialog::backdrop{background:rgba(5,20,25,.55)}
dialog h3{margin:0 0 2px;font-size:22px;font-weight:800}
.wrow{display:grid;grid-template-columns:1fr 80px;gap:8px;margin:10px 0}
.pv{display:flex;justify-content:space-between;align-items:baseline;background:var(--accent);color:var(--on);border-radius:10px;padding:10px 14px;margin-bottom:14px}
.pv strong{font-size:26px;font-weight:800}
.search{position:relative;margin-bottom:12px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted);pointer-events:none}
#busca{font-size:18px;padding:12px 12px 12px 42px}
.shop{display:grid;grid-template-columns:112px 1fr;gap:10px;align-items:start}
.cats{display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line);border-radius:14px;background:rgba(240,249,250,.9)}
.cat{border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;padding:12px 10px;font-weight:600;font-size:14px;line-height:1.2;overflow-wrap:anywhere}
.cats .cat:last-child{border-bottom:0}
.cat.on{background:var(--accent);color:var(--on)}
@media (min-width:560px){.shop{grid-template-columns:150px 1fr;gap:16px}.cat{padding:13px 14px;font-size:16px}}
@media (max-width:559px){.grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}.fish{padding:10px;min-height:76px}.fn{font-size:16px}.fp{font-size:14px}}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pay button:last-child:nth-child(odd){grid-column:1/-1}
.pay button{min-height:48px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--accent-text);font-weight:700}
.pay button:hover{background:var(--accent);color:var(--on)}
.pay button:disabled{opacity:.4;cursor:not-allowed}
.pay button:disabled:hover{background:transparent;color:var(--accent-text)}
.flash{background:var(--soft);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;margin:14px 0 0;font-size:16px}
.lock{max-width:380px;margin:12px auto 0;background:rgba(255,255,255,.88)}
.erow{display:grid;grid-template-columns:1fr 90px auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.erow strong,.erow span{display:block}
@media (max-width:559px){.erow{grid-template-columns:1fr 1fr 1fr}.erow>div:first-child{grid-column:1/-1}}
.sum{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);align-items:baseline}
.sum b{font-size:20px}
.sale{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.sale>.sub{grid-column:1/-1}
.hero{text-align:center;margin-bottom:6px}
.hero h1{font-size:24px}
.wm{font-weight:800;color:var(--accent-text);line-height:1}
.wm small{display:block;font-weight:600;font-size:.4em;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.wm.lg{font-size:40px;margin:0 auto 10px}
.wm.sm{font-size:20px;margin-left:auto;text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<div id="app"></div>
<dialog id="dlg">
  <h3 id="dn"></h3>
  <p class="sub" id="dp"></p>
  <div class="wrow">
    <input id="w" inputmode="decimal" placeholder="Peso, ex.: 1,250" autocomplete="off" aria-label="Peso">
    <span id="u" style="align-self:center;font-weight:600">kg</span>
  </div>
  <p class="warn" id="dw" style="margin:0 0 8px"></p><div class="pv"><span>Valor</span><strong id="pv">R$ 0,00</strong></div>
  <div class="actions"><button class="ghost" data-a="cancel">Cancelar</button><button class="primary" data-a="add">Adicionar à compra</button></div>
</dialog>
<script>
const KEY='peixaria-v1',AK='peixaria-auth';
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const dstr=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const hoje=()=>dstr(new Date());
const ontem=()=>{const d=new Date();d.setDate(d.getDate()-1);return dstr(d)};
const fmt=s=>s.split('-').reverse().join('/');
const brl=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const fkg=k=>k.toLocaleString('pt-BR',{minimumFractionDigits:3,maximumFractionDigits:3})+' kg';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isFinite(x)?x:0};
const cents=x=>Math.round(x*100)/100;
const r3=x=>Math.round(x*1000)/1000;
const sgn=x=>x>0?'+':'';
const fqn=(u,k)=>u==='un'?k+(k===1?' unidade':' unidades'):fkg(k);
const fq=x=>fqn(x.u,x.kg);
const fqe=f=>f.u==='un'?f.e+' un':fkg(f.e);
const fu=(f,k)=>f.u==='un'?k+' un':fkg(k);

/* ---------- dados ---------- */
const def={vendedores:['Vendedor 1','Vendedor 2'],peixes:[{n:'Tilápia',p:25},{n:'Salmão',p:69.9},{n:'Camarão',p:59.9},{n:'Sardinha',p:18},{n:'Pescada',p:32}],upd:hoje()};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||def}catch(e){db=def}
db.vendas=db.vendas||[];db.mov=db.mov||[];
db.cats=db.cats||['Balcão','Camarão','Filés','Importados','Preparado','Moluscos','Gelo','Condimentos'].map((n,i)=>({id:'c'+(i+1),n}));
db.peixes.forEach((f,i)=>{if(f.c===undefined)f.c='';if(!f.u)f.u='kg';if(!f.id)f.id='p'+Date.now().toString(36)+i;if(f.e===undefined)f.e=null;
  if(f.e!=null&&!db.mov.some(m=>m.pid===f.id))db.mov.push({d:ontem(),pid:f.id,q:f.e})});
const flush=()=>{clearTimeout(tm);try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
let tm;const save=flush,saveL=()=>{clearTimeout(tm);tm=setTimeout(flush,300)};
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
save();

/* ---------- estoque ---------- */
const fishById=id=>db.peixes.find(p=>p.id===id);
const baixa=(pid,q)=>{const f=fishById(pid);if(f&&f.e!=null)f.e=r3(f.e-q)};
const volta=(pid,q)=>baixa(pid,-q);
const mov=(f,q)=>db.mov.push({d:hoje(),pid:f.id,q:r3(q)});
const qtd=(f,v)=>f.u==='un'?Math.round(v):v;
function estqHtml(d){
  const sold=pid=>{let a=0,b=0;db.vendas.forEach(v=>{if(v.d<d)return;(v.it||[]).forEach(x=>{if(x.pid!==pid)return;if(v.d===d)a+=x.q;else b+=x.q})});return[a,b]};
  const L=db.peixes.filter(f=>f.e!=null&&db.mov.some(m=>m.pid===f.id&&m.d<=d)).map(f=>{
    let ent=0,aft=0;db.mov.forEach(m=>{if(m.pid!==f.id)return;if(m.d===d)ent+=m.q;else if(m.d>d)aft+=m.q});
    const[out,outAft]=sold(f.id),fim=r3(f.e-aft+outAft),ini=r3(fim-ent+out);
    return `<div class="sum"><span><strong>${esc(f.n||'Sem nome')}</strong></span><b class="${fim<0?'neg':''}">Final: ${fu(f,fim)}</b><span class="sub">Início ${fu(f,ini)} · Entradas ${sgn(ent)}${fu(f,r3(ent))} · Vendido −${fu(f,r3(out))}</span></div>`}).join('');
  return L||'<p class="sub">Nenhum item com estoque controlado neste dia. Cadastre as quantidades na tela Controlar estoque.</p>'}

let auth=null;try{auth=JSON.parse(localStorage.getItem(AK))}catch(e){}
let unlocked=false,lockMsg='',recShow='',forgot=false,view='home',si=0,pend=null,lv='',idle=Date.now(),fd=hoje(),flash='',delP=null,q='',cat='todos';
const carts={};
const sha=async s=>{try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))>>>0;return'f'+h}};
const saveAuth=()=>{try{localStorage.setItem(AK,JSON.stringify(auth))}catch(e){}};
const cn=s=>String(s).toUpperCase().replace(/[^A-Z0-9]/g,'');
const newAuth=async v=>{const s=Math.random().toString(36).slice(2),keep=auth&&auth.r?{rs:auth.rs,r:auth.r}:{};auth={s,h:await sha(s+v),...keep};saveAuth()};
const setRec=async c=>{const rs=Math.random().toString(36).slice(2);auth={...auth,rs,r:await sha(rs+cn(c))};saveAuth()};
const genCode=()=>{const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=new Uint8Array(12);try{crypto.getRandomValues(b)}catch(e){for(let i=0;i<12;i++)b[i]=Math.floor(Math.random()*256)}let c='';b.forEach((x,i)=>{c+=A[x%A.length];if(i%4===3&&i<11)c+='-'});return c};
async function resetPw(){const k=$('rc').value,a=$('pw').value,b=$('pwc').value;if(!auth||!auth.r)lockMsg='Este caixa não tem código de recuperação cadastrado.';else if(await sha(auth.rs+cn(k))!==auth.r)lockMsg='Código de recuperação incorreto.';else if(a.length<4)lockMsg='Use pelo menos 4 caracteres.';else if(a!==b)lockMsg='As senhas não são iguais.';else{await newAuth(a);const c=genCode();await setRec(c);recShow=c;forgot=false;lockMsg=''}render()}
async function newRec(){const c=genCode();await setRec(c);$('pwmsg').innerHTML='Novo código de recuperação: <strong>'+c+'</strong>. Anote agora; ele não aparece de novo e o anterior deixou de valer.'}
async function tryUnlock(){const v=$('pw').value;if(auth&&await sha(auth.s+v)===auth.h){unlocked=true;lockMsg=''}else lockMsg='Senha incorreta.';idle=Date.now();render()}
async function setPw(){const a=$('pw').value,b=$('pwc').value;if(a.length<4)lockMsg='Use pelo menos 4 caracteres.';else if(a!==b)lockMsg='As senhas não são iguais.';else{await newAuth(a);const c=genCode();await setRec(c);recShow=c;lockMsg=''}idle=Date.now();render()}
async function chPw(){const m=$('pwmsg'),o=$('pw0').value,a=$('pw1').value,b=$('pw2').value;if(await sha(auth.s+o)!==auth.h)m.textContent='Senha atual incorreta.';else if(a.length<4)m.textContent='Use pelo menos 4 caracteres.';else if(a!==b)m.textContent='As senhas não são iguais.';else{await newAuth(a);$('pw0').value=$('pw1').value=$('pw2').value='';m.textContent='Senha alterada.'}}

/* ---------- ações ---------- */
function act(a,d){const i=+d.i;
 if(a==='unlock')return tryUnlock();if(a==='setpw')return setPw();if(a==='resetpw')return resetPw();
 if(a==='forgot'){forgot=true;lockMsg='';return render()}if(a==='back'){forgot=false;lockMsg='';return render()}
 if(a==='recok'){recShow='';unlocked=true;idle=Date.now();return render()}
 if(!unlocked)return;if(a==='newrec')return newRec();if(a==='chpw')return chPw();
 if(a==='venda'){si=i;q='';view='venda'}
 else if(a==='home'||a==='cfg'||a==='est')view=a;
 else if(a==='fech'){fd=hoje();delP=null;view='fech'}
 else if(a==='lock'){unlocked=false;lockMsg=''}
 else if(a==='esum'){const v=num($('e'+i).value),f=db.peixes[i];if(v>0){const n=qtd(f,v);f.e=r3((f.e||0)+n);mov(f,n);save()}}
 else if(a==='eset'){const t=$('e'+i).value.trim(),f=db.peixes[i];
   if(t===''){f.e=null;db.mov=db.mov.filter(m=>m.pid!==f.id)}
   else{const n=r3(qtd(f,num(t)));mov(f,n-(f.e||0));f.e=n}save()}
 else if(a==='cat'){cat=d.c;q=''}
 else if(a==='addc'){db.cats.push({id:'c'+Date.now(),n:'Nova categoria'});save()}
 else if(a==='delc'){const c=db.cats[i];db.peixes.forEach(f=>{if(f.c===c.id)f.c=''});if(cat===c.id)cat='todos';db.cats.splice(i,1);save()}
 else if(a==='pagar'){const c=carts[si]||[];if(!c.length)return;const t=total(),n=new Date();
   db.vendas.push({id:'v'+Date.now()+Math.floor(Math.random()*1000),d:hoje(),h:pad(n.getHours())+':'+pad(n.getMinutes()),v:db.vendedores[si]||'Sem nome',pg:d.p,itens:c.map(x=>x.n+' '+fq(x)).join(', '),it:c.map(x=>({pid:x.pid,n:x.n,u:x.u||'kg',q:x.kg,t:x.t})),t});
   c.forEach(x=>baixa(x.pid,x.kg));save();carts[si]=[];view='home';flash='Venda de '+brl.format(t)+' registrada em '+PG[d.p]+'.'}
 else if(a==='delsale'){if(delP===d.id){const v=db.vendas.find(x=>x.id===d.id);(v&&v.it||[]).forEach(x=>volta(x.pid,x.q));db.vendas=db.vendas.filter(x=>x.id!==d.id);delP=null;save()}else delP=d.id}
 else if(a==='delf'){db.peixes.splice(i,1);save()}
 else if(a==='addf'){db.peixes.push({id:'p'+Date.now().toString(36),n:'',p:0,c:'',u:'kg',e:null});save();render();[...document.querySelectorAll('[data-k=n]')].pop().focus();return}
 else if(a==='delv'){if(db.vendedores.length>1){db.vendedores.splice(i,1);save()}}
 else if(a==='addv'){db.vendedores.push('Vendedor '+(db.vendedores.length+1));save()}
 else if(a==='ok'){db.upd=hoje();save()}
 else if(a==='pick'){pend=db.peixes[i];$('dn').textContent=pend.n||'Sem nome';const un=pend.u==='un';$('dp').textContent=brl.format(pend.p)+(un?' por unidade':' por kg')+(pend.e!=null?', estoque: '+fqe(pend):'');$('w').value='';$('u').style.display=un?'none':'';$('w').parentNode.style.gridTemplateColumns=un?'1fr':'';$('w').placeholder=un?'Quantidade, ex.: 2':'Peso, ex.: 1,250';$('w').inputMode=un?'numeric':'decimal';prev();$('dlg').showModal();$('w').focus();return}
 else if(a==='cancel'){$('dlg').close();return}
 else if(a==='add'){const kg=kgNow();if(kg<=0){$('w').focus();return}(carts[si]=carts[si]||[]).push({n:pend.n||'Sem nome',p:pend.p,u:pend.u,pid:pend.id,kg,t:cents(pend.p*kg)});q='';flash=(pend.n||'Sem nome')+' '+fq({u:pend.u,kg})+' adicionado à compra de '+(db.vendedores[si]||'Sem nome')+'.';view='home';$('dlg').close()}
 else if(a==='deli')carts[si].splice(i,1);
 else if(a==='clear')carts[si]=[];
 render()}

document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b)act(b.dataset.a,b.dataset)});

 if(!k)return;if(k==='dia'){fd=t.value||hoje();return render()}const i=+t.dataset.i;
 if(k==='n')db.peixes[i].n=t.value;
 else if(k==='p'){db.peixes[i].p=num(t.value);db.upd=hoje()}
